name: Node 22 runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.20.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: '1.12.2.1565'
          clj-kondo: '2025.07.28'
          bb: '1.12.207'
      - name: Verify toolchain and frozen dependency closure
        run: |
          test "$(node --version)" = v22.20.0
          test "$(npm --version)" = 10.9.3
          npm ci --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json deps.edn
      - name: Resolve public pinned Git dependencies
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: core.askPass
          GIT_CONFIG_VALUE_1: ''
        run: |
          unset GIT_ASKPASS SSH_ASKPASS
          clojure -Srepro -P
      - name: Guard regressions and source lint
        run: |
          npm run test:guard
          npm run lint
          bb scripts/check-review-worker-plan.clj
          bb scripts/check_review_worker_plan_test.clj
      - name: Actual CLJS tests and server compilation
        run: |
          npm test
          bash scripts/compile-clean.sh server dist/server.js npm run build
          bash scripts/compile-clean.sh clio-native target/clio-native/probe.js npm run build:clio-native
      - name: Production dependency startup and SIGTERM
        shell: bash
        run: |
          mkdir -p .ημ
          stage=$(mktemp -d "$PWD/.ημ/production.XXXXXX")
          trap 'rm -rf "$stage"' EXIT
          cp package.json package-lock.json "$stage/"
          cp -R dist "$stage/dist"
          cp -R target/clio-native "$stage/clio-native"
          npm ci --omit=dev --no-audit --no-fund --prefix "$stage"
          cmp package-lock.json "$stage/package-lock.json"
          node scripts/check-clio-native.mjs "$stage/clio-native/probe.js"
          node scripts/check-startup.mjs "$stage/dist/server.js"
          node scripts/check-startup.mjs "$stage/dist/server.js" --clio
